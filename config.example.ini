; WeChat-Report 示例配置 — 复制为 config.ini 后填写自己的密钥
[app]
name = WeChat-Report
version = 1.0.0
language = zh
theme = dark-blue
appearance = dark

[extract]
navigate_mode = auto
manual_countdown = 10
settle_wait = 1.5
time_window = 
scroll_to_top_attempts = 800
# 滚轮间歇（秒）：过快档位会被微信吞掉，实测 0.22 是速度/吞档平衡点
scroll_pause = 0.22
stable_frames_to_stop = 3
# 上滚预算（秒/聊天）：0=不限；聊天记录加载是动态的，预算只作兜底
scrollup_time_budget = 36000
scroll_step = 15
capture_overlap = 80
max_screens = 3000
checkpoint_enabled = true
output_dir = ./output
keep_screenshots = true

[ocr]
score_threshold = 0.5
speaker_attribution = true

[bubbles]
image_min_w = 90
image_min_h = 90
image_min_std = 20.0
image_iou_merge = 0.3

[ai]
api_key = 
base_url = https://open.bigmodel.cn/api/paas/v4
text_models = glm-4-flash-250414,glm-4.5-flash
vision_model = glm-4v-flash
max_tokens = 4096
temperature = 0.3
chunk_chars = 3500
max_chunks = 80
vision_images = 12
retry_times = 4
retry_backoff = 2.0
request_timeout = 120
disable_thinking = true

[report]
template = work
title_prefix = 
org_name = 
top_keywords = 15
top_speakers = 10

[notify]
enabled = true
webhook =
milestones = start,extract,analyze,report,done
send_report_file = true

[batch]
; 批量导出（--all）：所有会话各一份聊天记录 word
skip_names = 微信团队,订阅号消息,文件传输助手,腾讯文档,微信支付,微信豆包
enum_rounds = 260
max_images_embed = 50
report_every = 5

[safety]
input_zone_ratio = 0.80
allow_enter_key = false
allow_right_click = false

